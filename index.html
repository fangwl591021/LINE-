<!DOCTYPE html>
<html lang="zh-TW" class="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LINE 商業名片智能系統</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#06C755",
            "primary-light": "#e6f9ed",
            background: "#f8fafc",
            "input-bg": "#f0f2f8",
            "text-main": "#0f172a",
          }
        },
      },
    };
  </script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <link rel="stylesheet" href="css/styles.css?v=7.1">
  <script src="js/config.js?v=7.4"></script>

  <style type="text/tailwindcss">
    .custom-input { @apply w-full py-4 px-5 bg-slate-100 border-none rounded-2xl outline-none focus:ring-2 focus:ring-blue-500/20 transition-all font-medium text-text-main; }
    .textarea-block { @apply w-full p-4 bg-slate-100 border-none rounded-2xl outline-none focus:bg-white focus:ring-2 focus:ring-blue-500/20 transition-all text-[15px] text-slate-800 resize-none leading-relaxed placeholder-slate-400; }

    .nav-btn { @apply flex flex-col items-center justify-center transition-all flex-1 text-slate-400 h-full; min-width: 48px; }
    .nav-btn .icon-box { @apply px-3 py-1.5 rounded-full transition-all flex items-center justify-center mb-0.5; }
    .nav-active { @apply text-slate-800 font-bold; }
    .nav-active .icon-box { @apply bg-slate-100 text-slate-800; }
    .nav-active .material-symbols-outlined { font-variation-settings: 'FILL' 1; }
  </style>
</head>
<body class="font-body text-text-main min-h-screen flex flex-col items-center">

<div id="loading-screen" class="fixed inset-0 bg-white z-[1000] flex flex-col items-center justify-center transition-opacity duration-300">
    <span class="material-symbols-outlined animate-spin text-5xl text-[#06C755] mb-4">autorenew</span>
    <h2 id="loading-text" class="text-xl font-black text-slate-800">系統驗證中...</h2>
</div>

<div id="toast-container" class="fixed top-16 left-0 right-0 z-[10000] flex flex-col items-center gap-2 pointer-events-none"></div>

<div id="app" class="w-full max-w-md bg-background h-screen relative flex flex-col shadow-2xl overflow-hidden">

  <nav class="fixed top-0 w-full max-w-md z-40 bg-white/90 backdrop-blur-xl px-5 py-4 flex justify-between items-center left-1/2 -translate-x-1/2 border-b border-slate-100">
    <div class="flex items-center gap-1.5">
      <span id="header-site-name" class="text-[20px] font-black text-slate-800 tracking-tight">LINE商機引擎</span>
      <span id="header-admin-badge" class="hidden bg-[#1e293b] text-white text-[10px] px-2 py-0.5 rounded-full tracking-wider font-bold shadow-sm">ADMIN</span>
    </div>

    <div class="flex items-center gap-3">
      <img id="avatar" src="" class="w-8 h-8 rounded-full border border-slate-200 hidden object-cover shadow-sm">
      <button id="top-nav-switch" onclick="window.toggleAdminMode()" class="hidden w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-600 active:scale-90 transition-transform shadow-sm">
        <span class="material-symbols-outlined text-[18px]">swap_horiz</span>
      </button>
    </div>
  </nav>

  <main id="main" class="flex-1 overflow-y-auto pb-32 pt-20 px-4 space-y-6">

    <!-- ==================== 一般註冊頁面 ==================== -->
    <div id="page-register" class="hidden h-full flex-col items-center justify-center animate-in fade-in pb-10">
      <div class="bg-white rounded-3xl p-8 shadow-sm border border-slate-100 w-full space-y-5">
        <div class="w-16 h-16 bg-primary-light text-primary rounded-full flex items-center justify-center mx-auto mb-2">
          <span class="material-symbols-outlined text-3xl icon-filled">person_add</span>
        </div>
        <h2 class="text-xl font-black text-center text-slate-800">建立專屬商務檔案</h2>
        <p class="text-xs text-center text-slate-500 mb-6">請先完成設定以啟用 AI 智能配對與名片庫</p>

        <div><label class="text-xs text-slate-500 font-bold ml-1">真實姓名</label><input id="reg-name" class="custom-input mt-1" type="text" placeholder="例:王大明"></div>
        <div><label class="text-xs text-slate-500 font-bold ml-1">手機號碼</label><input id="reg-phone" class="custom-input mt-1 font-mono" type="tel" placeholder="09xxxxxxxx"></div>
        <div><label class="text-xs text-slate-500 font-bold ml-1">主要業種</label><input id="reg-industry" class="custom-input mt-1" type="text" placeholder="例:保險、房仲、設計"></div>
        <div><label class="text-xs text-slate-500 font-bold ml-1">出生年月日</label><input id="reg-birthday" class="custom-input mt-1 font-mono text-slate-500" type="date"></div>

        <button id="btn-register" onclick="window.submitRegistration()" class="w-full bg-[#06C755] text-white py-4 rounded-2xl font-bold mt-6 shadow-md active:scale-95 transition-transform flex justify-center items-center gap-2">
          開始使用 <span class="material-symbols-outlined">arrow_forward</span>
        </button>
      </div>
    </div>

    <!-- ==================== 🏆 名片認領與註冊整合頁面 ==================== -->
    <div id="page-claim-register" class="hidden h-full flex-col items-center justify-center animate-in zoom-in-95 pb-10 mt-4">
      <div class="bg-white rounded-3xl p-8 shadow-xl shadow-blue-500/10 border border-blue-100 w-full space-y-5 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-blue-400 to-[#06C755]"></div>
        <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-2 border border-blue-100">
          <span class="material-symbols-outlined text-3xl icon-filled">card_membership</span>
        </div>
        <h2 class="text-xl font-black text-center text-slate-800">認領專屬名片</h2>
        <p class="text-[13px] text-center text-slate-500 mb-6 font-medium leading-relaxed">您的推薦人已經為您建好名片檔案了！<br>請確認下方資料無誤，即可完成綁定與註冊。</p>

        <input type="hidden" id="claim-row-id">
        <input type="hidden" id="claim-ref-id">
        <input type="hidden" id="claim-net-id">

        <div><label class="text-xs text-slate-500 font-bold ml-1">您的姓名 <span class="text-red-500">*</span></label><input id="claim-name" class="custom-input mt-1 !bg-blue-50/30 !border !border-blue-100" type="text"></div>
        <div><label class="text-xs text-slate-500 font-bold ml-1">手機號碼 <span class="text-red-500">*</span></label><input id="claim-phone" class="custom-input mt-1 font-mono !bg-blue-50/30 !border !border-blue-100" type="tel"></div>
        <div><label class="text-xs text-slate-500 font-bold ml-1">公司名稱</label><input id="claim-company" class="custom-input mt-1" type="text"></div>
        <div><label class="text-xs text-slate-500 font-bold ml-1">職稱</label><input id="claim-title" class="custom-input mt-1" type="text"></div>

        <button id="btn-claim-register" onclick="window.submitClaimRegistration()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black text-[16px] mt-6 shadow-lg shadow-blue-500/30 active:scale-95 transition-transform flex justify-center items-center gap-2">
          確認認領並啟用名片 <span class="material-symbols-outlined">how_to_reg</span>
        </button>
      </div>
    </div>

    <!-- content omitted unchanged -->
  </main>

  <nav id="bottom-nav" class="fixed bottom-0 w-full max-w-md bg-white/95 backdrop-blur-xl flex justify-evenly items-center px-1 py-2 z-40 pb-safe shadow-[0_-10px_20px_rgba(0,0,0,0.03)] left-1/2 -translate-x-1/2 h-[76px] rounded-t-3xl border-t border-slate-100 hidden transition-all">
    <button onclick="window.goPage('home')"        id="nav-btn-home"      class="nav-btn"><div class="icon-box"><span class="material-symbols-outlined text-[24px]">home</span></div><span class="text-[10px] font-bold tracking-wide mt-0.5">首頁</span></button>
    <button onclick="window.goPage('card')"        id="nav-btn-card"      class="nav-btn"><div class="icon-box"><span class="material-symbols-outlined text-[24px]">recent_patient</span></div><span class="text-[10px] font-bold tracking-wide mt-0.5">名片庫</span></button>
    <button onclick="window.goPage('matchmake')"  id="nav-btn-matchmake" class="nav-btn"><div class="icon-box"><span class="material-symbols-outlined text-[24px]">psychology</span></div><span class="text-[10px] font-bold tracking-wide mt-0.5">配對</span></button>
    <button onclick="window.goPage('admin-settings')" id="nav-btn-admin-settings" class="nav-btn"><div class="icon-box"><span class="material-symbols-outlined text-[24px]">person</span></div><span class="text-[10px] font-bold tracking-wide mt-0.5">設定</span></button>
  </nav>

  <nav id="bottom-nav-admin" class="fixed bottom-0 w-full max-w-md bg-white border-t border-slate-100 flex justify-evenly items-center px-2 py-2 z-[80] pb-safe shadow-[0_-4px_15px_rgba(0,0,0,0.03)] left-1/2 -translate-x-1/2 h-[76px] rounded-t-3xl hidden">
    <button onclick="window.goPage('admin-activities')" id="admin-nav-btn-admin-activities" class="nav-btn"><div class="icon-box"><span class="material-symbols-outlined text-[24px]">fact_check</span></div><span class="text-[10px] mt-1 font-bold whitespace-nowrap">核銷</span></button>
    <button onclick="window.goPage('active')"           id="admin-nav-btn-active" class="nav-btn"><div class="icon-box"><span class="material-symbols-outlined text-[24px]">add_circle</span></div><span class="text-[10px] mt-1 font-bold whitespace-nowrap">建立</span></button>
    <button onclick="window.goPage('admin-crm')"        id="admin-nav-btn-admin-crm" class="nav-btn"><div class="icon-box"><span class="material-symbols-outlined text-[24px]">groups</span></div><span class="text-[10px] mt-1 font-bold whitespace-nowrap">CRM</span></button>
    <button onclick="window.goPage('matchmake')"        id="admin-nav-btn-matchmake" class="nav-btn"><div class="icon-box"><span class="material-symbols-outlined text-[24px]">psychology</span></div><span class="text-[10px] mt-1 font-bold whitespace-nowrap">配對</span></button>
    <button onclick="window.goPage('card')"             id="admin-nav-btn-card" class="nav-btn"><div class="icon-box"><span class="material-symbols-outlined text-[24px]">recent_patient</span></div><span class="text-[10px] mt-1 font-bold whitespace-nowrap">名片</span></button>
    <button onclick="window.goPage('admin-settings')"   id="admin-nav-btn-admin-settings" class="nav-btn"><div class="icon-box"><span class="material-symbols-outlined text-[24px]">settings</span></div><span class="text-[10px] mt-1 font-bold whitespace-nowrap">參數</span></button>
  </nav>
</div>

<!-- modals omitted unchanged -->

<script src="js/core.js?v=7.4"></script>
<script src="js/navigation.js?v=7.2"></script>
<script src="js/modules/cropper.js?v=7.1"></script>
<script src="js/modules/cards.js?v=7.1"></script>
<script src="js/modules/ecard.js?v=7.2"></script>
<script src="js/modules/mycard.js?v=7.4"></script>
<script src="js/modules/matchmake.js?v=7.2"></script>
<script src="js/modules/activities.js?v=7.1"></script>
<script src="js/modules/admin.js?v=7.1"></script>
<script src="js/modules/home.js?v=7.4"></script>
<script src="js/modules/settings.js?v=7.1"></script>
<script src="js/modules/crm.js?v=7.1"></script>
<script src="js/auth.js?v=7.3"></script>

</body>
</html>
