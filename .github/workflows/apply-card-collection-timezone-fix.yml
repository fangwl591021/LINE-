name: Apply Card Collection Timezone Fix

on:
  push:
    branches:
      - agent/fix-card-collection-timezone

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-card-collection-timezone
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply timezone patch
        run: node tools/apply-card-collection-timezone-fix.js
      - name: Verify timezone contract
        run: node tools/check-card-collection-timezone-contract.js
      - name: Run smoke
        run: npm run smoke
      - name: Commit generated files
        run: |
          if git diff --quiet -- index.html js/modules/cards.js; then
            echo "No generated change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/modules/cards.js
          git commit -m "fix: display card collection time in local timezone"
          git push origin HEAD:agent/fix-card-collection-timezone
