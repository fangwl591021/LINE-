name: Apply Business Intent Matchmaking

on:
  push:
    branches:
      - agent/business-intent-tab-matchmaking

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/business-intent-tab-matchmaking
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply business intent wiring
        run: node tools/apply-business-intent-matchmaking.js
      - name: Verify business intent contract
        run: node tools/check-business-intent-matchmaking-contract.js
      - name: Run smoke
        run: npm run smoke
      - name: Commit generated files
        run: |
          if git diff --quiet -- index.html js/modules/matchmake.js workerbackup.js; then
            echo "No generated change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/modules/matchmake.js workerbackup.js
          git commit -m "feat: connect business intent to AI matchmaking"
          git push origin HEAD:agent/business-intent-tab-matchmaking
