name: Apply Ticker Readable Pace
on:
  push:
    branches: [agent/ticker-readable-pace]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ticker-readable-pace
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: node tools/apply-ticker-readable-pace.js
      - name: Verify ticker pace
        run: node tools/check-ticker-readable-pace.js
      - name: Run smoke
        run: npm run smoke
      - name: Commit generated files
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/modules/home.js index.html
          git commit -m "style: slow ticker and separate messages"
          git push origin HEAD:agent/ticker-readable-pace
