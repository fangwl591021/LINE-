name: Apply Banner Card Customer Shortcuts

on:
  push:
    branches:
      - agent/banner-card-customer-shortcuts

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/banner-card-customer-shortcuts
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply banner move
        run: node tools/apply-banner-card-customer-shortcuts.js
      - name: Verify banner move
        run: node tools/check-banner-card-customer-shortcuts.js
      - name: Run smoke
        run: npm run smoke
      - name: Commit generated index
        run: |
          if git diff --quiet -- index.html; then
            echo "No generated change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: move card collection and customers into top banner"
          git push origin HEAD:agent/banner-card-customer-shortcuts
