name: Apply Inbox Send Result Guard

on:
  push:
    branches:
      - agent/fix-inbox-false-success

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-inbox-false-success
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply inbox send guard
        run: node tools/apply-inbox-send-result-guard.js
      - name: Verify inbox send guard
        run: node tools/check-inbox-send-result-guard.js
      - name: Run smoke
        run: npm run smoke
      - name: Commit generated files
        run: |
          if git diff --quiet -- js/modules/inbox.js index.html; then
            echo "No generated change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/modules/inbox.js index.html
          git commit -m "fix: surface failed inbox sends"
          git push origin HEAD:agent/fix-inbox-false-success
