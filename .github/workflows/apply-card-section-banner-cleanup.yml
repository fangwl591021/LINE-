name: Apply Card Section Banner Cleanup

on:
  push:
    branches:
      - agent/card-section-banner-cleanup

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-section-banner-cleanup
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove lower switch
        run: node tools/apply-card-section-banner-cleanup.js
      - name: Verify card section banner
        run: node tools/check-card-page-banner-shortcuts.js
      - name: Run smoke
        run: npm run smoke
      - name: Commit generated index
        run: |
          if git diff --quiet -- index.html; then
            echo "No generated change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: remove duplicate card customer switch"
          git push origin HEAD:agent/card-section-banner-cleanup
