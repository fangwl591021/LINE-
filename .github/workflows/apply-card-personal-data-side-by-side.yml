name: Apply Card Personal Data Side By Side

on:
  push:
    branches:
      - agent/card-personal-data-side-by-side

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-personal-data-side-by-side
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply layout patch
        run: node tools/apply-card-personal-data-side-by-side.js
      - name: Verify layout contract
        run: node tools/check-card-personal-data-side-by-side-contract.js
      - name: Run smoke
        run: npm run smoke
      - name: Commit generated files
        run: |
          if git diff --quiet -- index.html js/navigation.js tools/check-android-business-card-camera-contract.js; then
            echo "No generated change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/navigation.js tools/check-android-business-card-camera-contract.js
          git commit -m "fix: place personal data controls side by side"
          git push origin HEAD:agent/card-personal-data-side-by-side
