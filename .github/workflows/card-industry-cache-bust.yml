name: Card Industry Cache Bust

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/card-industry-cache-bust.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Bust A-kaffit adapter cache
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = 'js/modules/a-kaffit-card-scanner-adapter.js?v=3.0'
          new = 'js/modules/a-kaffit-card-scanner-adapter.js?v=3.1'
          if new not in text:
              if old not in text:
                  raise SystemExit('Missing adapter cache-bust anchor')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/card-industry-cache-bust.yml

      - name: Commit cache bust
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/card-industry-cache-bust.yml
          git commit -m "fix: bust collected-card industry review cache"
          git push origin HEAD:main
