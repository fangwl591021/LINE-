name: Contract Guard

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  store-shop:
    name: Store shop isolated SQLite tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run test:store-shop
      - run: node --test test/store-wallet-summary.test.mjs test/store-history-popup.test.mjs
  guard:
    name: Run contract guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run full contract guard
        run: npm run guard:after
