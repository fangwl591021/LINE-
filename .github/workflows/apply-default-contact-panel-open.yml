name: Apply Default Contact Panel Open

on:
  push:
    branches:
      - agent/default-contact-panel-open

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/default-contact-panel-open
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply default contact panel patch
        run: node tools/apply-default-contact-panel-open.js
      - name: Verify contract
        run: node tools/check-default-contact-panel-open-contract.js
      - name: Run smoke
        run: npm run smoke
      - name: Commit generated files
        run: |
          if git diff --quiet -- js/navigation.js index.html; then
            echo "No generated change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/navigation.js index.html
          git commit -m "fix: open contact details by default"
          git push origin HEAD:agent/default-contact-panel-open
