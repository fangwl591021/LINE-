name: Apply Card Page Banner Shortcuts

on:
  push:
    branches:
      - agent/card-page-banner-shortcuts

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-page-banner-shortcuts
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply wiring
        run: node tools/apply-card-page-banner-shortcuts.js
      - name: Verify card-page banner behavior
        run: node tools/check-card-page-banner-shortcuts.js
      - name: Run smoke
        run: npm run smoke
      - name: Commit generated index
        run: |
          if git diff --quiet -- index.html; then
            echo "No generated change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: switch banner shortcuts on card page only"
          git push origin HEAD:agent/card-page-banner-shortcuts
