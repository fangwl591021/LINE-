name: Admin V2 Card Quota Patch

on:
  push:
    branches:
      - agent/admin-v2-card-quota-ui

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/admin-v2-card-quota-ui
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Patch admin v2 quota UI
        run: node tools/patch-admin-v2-card-quota.js

      - name: Run targeted contracts
        run: |
          node tools/check-card-quota-contract.js
          node tools/check-admin-card-quota-ui-contract.js

      - name: Remove one-time patch helpers
        run: |
          rm tools/patch-admin-v2-card-quota.js
          rm .github/workflows/admin-v2-card-quota-patch.yml

      - name: Commit patched admin UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-v2.html package.json tools/run-smoke-contracts.js tools/check-admin-card-quota-ui-contract.js tools/patch-admin-v2-card-quota.js .github/workflows/admin-v2-card-quota-patch.yml
          git commit -m "Add admin v2 card quota settings UI"
          git push origin HEAD:agent/admin-v2-card-quota-ui
