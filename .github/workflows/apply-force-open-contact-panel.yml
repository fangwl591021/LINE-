name: Apply Force Open Contact Panel
on:
  push:
    branches: [agent/force-open-contact-panel]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/force-open-contact-panel
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: node tools/apply-force-open-contact-panel.js
      - name: Verify contract
        run: node tools/check-force-open-contact-panel-contract.js
      - name: Run smoke
        run: npm run smoke
      - name: Commit generated files
        run: |
          if git diff --quiet -- index.html js/navigation.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/navigation.js
          git commit -m "fix: force open contact details on entry"
          git push origin HEAD:agent/force-open-contact-panel