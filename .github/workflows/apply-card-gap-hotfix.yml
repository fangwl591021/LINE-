name: Apply Card Gap Hotfix

on:
  push:
    branches:
      - agent/card-gap-hotfix

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-gap-hotfix
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply cache bust
        run: node tools/apply-card-gap-hotfix.js
      - name: Verify gap hotfix
        run: node tools/check-card-gap-hotfix.js
      - name: Run smoke
        run: npm run smoke
      - name: Commit generated index
        run: |
          if git diff --quiet -- index.html; then
            echo "No generated change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: remove card page banner gap"
          git push origin HEAD:agent/card-gap-hotfix
