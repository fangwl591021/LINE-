name: Apply MyCard Detail Banner

on:
  push:
    branches:
      - agent/mycard-detail-keep-banner

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mycard-detail-keep-banner
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply card-detail banner patch
        run: node tools/apply-mycard-detail-banner.js
      - name: Verify card-detail banner
        run: node tools/check-mycard-detail-banner-contract.js
      - name: Run smoke
        run: npm run smoke
      - name: Commit generated files
        run: |
          if git diff --quiet -- js/navigation.js index.html tools/check-android-business-card-camera-contract.js; then
            echo "No generated change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/navigation.js index.html tools/check-android-business-card-camera-contract.js
          git commit -m "fix: keep shared banner on card detail"
          git push origin HEAD:agent/mycard-detail-keep-banner
