name: Apply Home Banner Share Restore

on:
  push:
    branches:
      - agent/restore-home-banner-share

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/restore-home-banner-share
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply cache bust
        run: node tools/apply-home-banner-share-cache-bust.js
      - name: Verify restore contract
        run: node tools/check-home-banner-share-restore-contract.js
      - name: Run smoke
        run: npm run smoke
      - name: Commit generated index
        run: |
          if git diff --quiet -- index.html; then
            echo "No generated change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: cache bust restored home banner share"
          git push origin HEAD:agent/restore-home-banner-share
