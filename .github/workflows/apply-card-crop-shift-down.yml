name: Apply Card Crop Shift Down

on:
  push:
    branches:
      - agent/card-crop-shift-down
    paths:
      - tools/apply-card-crop-shift-down.js
      - .github/workflows/apply-card-crop-shift-down.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-crop-shift-down
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focused patch
        run: node tools/apply-card-crop-shift-down.js
      - name: Validate one-pass crop contract
        run: node tools/check-card-vision-one-pass-contract.js
      - name: Commit patched runtime file
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/modules/card-vision-crop.js
          git commit -m "fix: shift low-confidence manual crop hint downward"
          git push origin HEAD:agent/card-crop-shift-down
