<!DOCTYPE html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI API 使用計量</title><script src="https://cdn.tailwindcss.com"></script><script src="https://static.line-scdn.net/liff/edge/versions/2.22.3/sdk.js"></script><script src="js/config.js?v=9.13"></script></head><body class="bg-slate-50 text-slate-900"><main class="max-w-6xl mx-auto p-4 md:p-8 space-y-6"><header><div class="text-xs font-black tracking-[.2em] text-emerald-600">AI BILLING FOUNDATION</div><h1 class="text-3xl font-black mt-1">AI API 使用計量</h1><p class="text-sm text-slate-500 mt-2">LINE- / line-engine。完整 API Key 仍只放 Cloudflare Secret，本頁只記錄使用與計費。</p></header><div class="flex gap-2"><input id="month" type="month" class="rounded-xl border-slate-200 bg-white px-4 py-2 font-bold"><button id="reload" class="rounded-xl bg-slate-900 text-white px-4 py-2 font-black">重新整理</button></div><div id="status" class="rounded-xl border px-4 py-3 text-sm font-bold bg-slate-100"></div><section class="grid md:grid-cols-2 gap-4" id="providers"></section><section class="grid md:grid-cols-4 gap-4"><div class="rounded-2xl bg-white border p-5"><div class="text-xs text-slate-400">本月請求</div><b id="req" class="text-3xl">0</b></div><div class="rounded-2xl bg-white border p-5"><div class="text-xs text-slate-400">成功</div><b id="ok" class="text-3xl">0</b></div><div class="rounded-2xl bg-white border p-5"><div class="text-xs text-slate-400">失敗</div><b id="fail" class="text-3xl">0</b></div><div class="rounded-2xl bg-white border p-5"><div class="text-xs text-slate-400">應收</div><b id="bill" class="text-3xl">NT$ 0</b></div></section><section class="rounded-2xl bg-white border overflow-hidden"><div class="p-5 border-b"><h2 class="font-black text-lg">功能計價</h2><p class="text-xs text-slate-500">先以每次請求計價；0 元代表只計量不收費。</p></div><div class="overflow-x-auto"><table class="w-full text-sm"><thead class="bg-slate-50"><tr><th class="p-3 text-left">功能</th><th class="p-3 text-right">單價 NT$</th><th class="p-3 text-right">操作</th></tr></thead><tbody id="rates"></tbody></table></div></section><section class="rounded-2xl bg-white border overflow-hidden"><div class="p-5 border-b"><h2 class="font-black text-lg">本月使用</h2></div><div class="overflow-x-auto"><table class="w-full text-sm"><thead class="bg-slate-50"><tr><th class="p-3 text-left">功能</th><th class="p-3 text-left">Provider</th><th class="p-3 text-left">狀態</th><th class="p-3 text-right">次數</th><th class="p-3 text-right">應收</th></tr></thead><tbody id="summary"></tbody></table></div></section></main><script>
const FEATURES={business_card_ocr:'名片 OCR',contact_matching:'智能配對',fate_tags:'五大標籤',card_safety:'名片健檢',card_copy:'名片文案',customer_import_mapping:'客戶匯入欄位分析'};const W=(window.WORKER_URL||window.Config?.WORKER_URL||'').replace(/\/$/,'');function money(v){return'NT$ '+Number(v||0).toLocaleString('zh-TW',{maximumFractionDigits:2})}async function tok(){await liff.init({liffId:window.LIFF_ID||window.Config?.LIFF_ID});if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});throw Error('LINE 登入中')}return liff.getAccessToken()}async function api(action,payload={}){const lineAccessToken=await tok();const r=await fetch(W,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,payload:{...payload,lineAccessToken}})});const b=await r.json();if(!r.ok||b.success===false)throw Error(b.error||'API_ERROR');return b.data||b}function status(t,bad=false){const e=document.getElementById('status');e.textContent=t;e.className='rounded-xl border px-4 py-3 text-sm font-bold '+(bad?'bg-red-50 text-red-700':'bg-emerald-50 text-emerald-700')}async function load(){try{status('讀取中...');const d=await api('getAiUsageDashboard',{month:document.getElementById('month').value});document.getElementById('providers').innerHTML=(d.providers||[]).map(p=>`<div class="rounded-2xl bg-white border p-5"><b class="uppercase">${p.provider}</b><div class="text-xs text-slate-500 mt-1">${p.secretName}</div><div class="text-xs text-slate-400 mt-2">${p.role}</div></div>`).join('');const rm=Object.fromEntries((d.rates||[]).map(x=>[x.feature_code,x]));document.getElementById('rates').innerHTML=Object.entries(FEATURES).map(([c,n])=>`<tr class="border-t"><td class="p-3 font-bold">${n}</td><td class="p-3 text-right"><input id="r-${c}" type="number" step="0.01" min="0" value="${Number(rm[c]?.unit_price_twd||0)}" class="w-28 rounded-lg border text-right"></td><td class="p-3 text-right"><button onclick="saveRate('${c}')" class="bg-emerald-600 text-white rounded-lg px-3 py-2 font-bold">儲存</button></td></tr>`).join('');let req=0,ok=0,fail=0,bill=0;for(const x of d.summary||[]){req+=Number(x.requests||0);bill+=Number(x.billable_amount_twd||0);if(x.status==='success')ok+=Number(x.requests||0);else fail+=Number(x.requests||0)}document.getElementById('req').textContent=req;document.getElementById('ok').textContent=ok;document.getElementById('fail').textContent=fail;document.getElementById('bill').textContent=money(bill);document.getElementById('summary').innerHTML=(d.summary||[]).map(x=>`<tr class="border-t"><td class="p-3 font-bold">${x.feature_name}</td><td class="p-3 uppercase">${x.provider}</td><td class="p-3">${x.status}</td><td class="p-3 text-right">${x.requests}</td><td class="p-3 text-right font-bold">${money(x.billable_amount_twd)}</td></tr>`).join('')||'<tr><td colspan="5" class="p-8 text-center text-slate-400">本月尚無資料</td></tr>';status('已更新')}catch(e){status('讀取失敗：'+e.message,true)}}async function saveRate(c){try{await api('saveAiBillingRate',{featureCode:c,unitPriceTwd:Number(document.getElementById('r-'+c).value||0)});await load()}catch(e){status('儲存失敗：'+e.message,true)}}window.saveRate=saveRate;document.getElementById('month').value=new Date().toISOString().slice(0,7);document.getElementById('reload').onclick=load;load();
</script></body></html>
