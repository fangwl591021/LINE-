name = "line-engine"
main = "workerbackup.js"
compatibility_date = "2026-04-23"

[triggers]
crons = ["0 1 * * *"]

[[kv_namespaces]]
binding = "ACTMASTER_KV"
id = "6785c24db6eb4080b48ce091c81d631c"

[[d1_databases]]
binding = "ACTMASTER_DB"
database_name = "actmaster_db"
database_id = "8a0107f9-000d-4810-b6bf-5d599b699195"

[[r2_buckets]]
binding = "IMG_BUCKET"
bucket_name = "linengine"

[vars]
# Set real secrets in Cloudflare Dashboard or with `wrangler secret put`.
# SOCIAL_LIKE_LIFF_ID must be a LINE LIFF app whose view type is Compact.
# SOCIAL_LIKE_LIFF_ID = ""
# GAS_URL = "https://script.google.com/macros/s/.../exec"
# LINE_CHANNEL_SECRET = ""
# LINE_CHANNEL_ACCESS_TOKEN = ""
# FORWARD_WEBHOOK_URL = ""
