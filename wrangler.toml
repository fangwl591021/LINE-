name = "line-engine"
main = "workerbackup.js"
compatibility_date = "2026-04-23"

[triggers]
crons = ["0 1 * * *"]

[[kv_namespaces]]
binding = "ACTMASTER_KV"
id = "6785c24db6eb4080b48ce091c81d631c"

[[d1_databases]]
binding = "ACTMASTER_DB"
database_name = "actmaster_db"
database_id = "8a0107f9-000d-4810-b6bf-5d599b699195"

[[r2_buckets]]
binding = "IMG_BUCKET"
bucket_name = "linengine"

[vars]
# Set real secrets in Cloudflare Dashboard or with `wrangler secret put`.
# SOCIAL_LIKE_LIFF_ID must be a LINE LIFF app whose view type is Compact.
SOCIAL_LIKE_LIFF_ID = "1660923784-NVioaXK7"
LINE_OA_FOLLOW_POINTS = "300"
MOTHER_CUS_ACCOUNT_URL = "https://aiwe.cc/index.php/cus_account/"
MOTHER_CUS_ACCOUNT_SHOP_ID = "78"
MOTHER_CUS_ACCOUNT_CLIENT_ID = "1660923784"
MOTHER_CUS_ACCOUNT_REDIRECT_URI = "https://aiwe.cc/index.php/line_login/677/"
MOTHER_LINE_MEMBER_API_URL = "https://aiwe.cc/index.php/wp-json/wetw/v1/check-or-create-line-user"
# Secret required: MOTHER_LINE_MEMBER_API_KEY
# GAS_URL = "https://script.google.com/macros/s/.../exec"
# LINE_CHANNEL_SECRET = ""
# LINE_CHANNEL_ACCESS_TOKEN = ""
# FORWARD_WEBHOOK_URL = ""

# Staging is intentionally isolated. Always deploy with: wrangler deploy --env staging
[env.staging]
name = "line-engine-staging"
workers_dev = true

[env.staging.triggers]
crons = []

[[env.staging.kv_namespaces]]
binding = "ACTMASTER_KV"
id = "999c9afee23e418a92ad9879a3a318cb"

[[env.staging.d1_databases]]
binding = "ACTMASTER_DB"
database_name = "line-engine-staging-db"
database_id = "70a45006-1c8c-44bb-b31c-1f4715f910bc"
migrations_dir = "migrations"

[[env.staging.r2_buckets]]
binding = "IMG_BUCKET"
bucket_name = "line-engine-staging-assets"

[env.staging.vars]
ENVIRONMENT = "staging"
SOCIAL_LIKE_LIFF_ID = "1660923784-NVioaXK7"
LINE_OA_FOLLOW_POINTS = "300"
MOTHER_CUS_ACCOUNT_URL = "https://aiwe.cc/index.php/cus_account/"
MOTHER_CUS_ACCOUNT_SHOP_ID = "78"
MOTHER_CUS_ACCOUNT_CLIENT_ID = "1660923784"
MOTHER_CUS_ACCOUNT_REDIRECT_URI = "https://aiwe.cc/index.php/line_login/677/"
MOTHER_LINE_MEMBER_API_URL = "https://aiwe.cc/index.php/wp-json/wetw/v1/check-or-create-line-user"
